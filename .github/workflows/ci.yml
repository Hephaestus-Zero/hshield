name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev linux-libc-dev
      - name: Compile with _FORTIFY_SOURCE=3 and -Werror
        run: make CFLAGS="-std=c11 -O3 -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -Wall -Wextra -Werror"
      - name: Run containment, TCP Landlock, and supply-chain test suite
        run: make test
      - name: Dogfood composite GitHub Action
        uses: ./
        with:
          path: .
          scan-artifacts: 'true'
